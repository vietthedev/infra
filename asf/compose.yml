services:
  asf:
    image: justarchi/archisteamfarm
    container_name: asf

    user: "${PUID}:${PGID}"
    restart: unless-stopped

    environment:
      ASF_UID: "1000"
      DOTNET_BUNDLE_EXTRACT_BASE_DIR: /tmp

    ports:
      - "127.0.0.1:1242:1242"
      - "[::1]:1242:1242"

    volumes:
      - ${HOME}/config:/app/config
      - ${HOME}/logs:/app/logs

    networks:
      - proxy

networks:
  proxy:
    external: true
