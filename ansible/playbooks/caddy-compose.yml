---
- name: Manage Caddy Compose project
  hosts: vps
  gather_facts: true

  pre_tasks:
    - name: Initialize VPS variables
      ansible.builtin.import_tasks: ../tasks/init.yml

  tasks:
    - name: Verify existing Caddy deployment
      ansible.builtin.import_role:
        name: caddy

    - name: Adopt Compose configuration
      ansible.builtin.import_role:
        name: caddy
        tasks_from: compose

