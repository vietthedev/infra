---
# Operating system
vps_distribution: Debian
vps_distribution_major_version: "13"

# Administrator
vps_user: salad

# Infrastructure paths
vps_home: "{{ ansible_facts['getent_passwd'][vps_user][4] }}"
vps_infra_dir: "{{ vps_home }}/infra"
vps_caddy_dir: "{{ vps_infra_dir }}/docker/caddy"
vps_asf_dir: "{{ vps_home }}/ASF"
vps_web_root: /srv/www

# Docker
docker_network_name: proxy
docker_network_driver: bridge

docker_expected_containers:
  - caddy
  - asf

docker_manage_network: false
docker_manage_packages: false

# Services
vps_services:
  - docker
  - ssh

# Public applications
vps_domains:
  - asf.vietthe.dev
  - manabie.vietthe.dev
  - nana.vietthe.dev

# SSH configuration management
ssh_manage_config: true

ssh_config_path: /etc/ssh/sshd_config.d/10-hardening.conf
ssh_service_name: ssh

# Caddy
caddy_container_name: caddy
caddy_project_dir: "{{ vps_caddy_dir }}"
caddy_config_path: /etc/caddy/Caddyfile

caddy_expected_domains:
  - asf.vietthe.dev
  - manabie.vietthe.dev
  - nana.vietthe.dev

# Deployment management
caddy_manage_config: false
caddy_manage_compose: false

# Local Git-managed configuration
caddy_config_source: >-
  {{ playbook_dir }}/../../docker/caddy/config

# Existing remote configuration
caddy_config_destination: "{{ caddy_project_dir }}/config"

# Existing remote environment file
caddy_env_file: "{{ caddy_project_dir }}/.env"

# ASF
asf_container_name: asf

# ASF runtime identity
# Empty means Docker uses the image's default user.
asf_expected_docker_user: ""

# Docker Compose project directory
asf_project_dir: "{{ vps_infra_dir }}/docker/asf"

# Persistent application data
asf_data_dir: "{{ vps_asf_dir }}"
asf_config_dir: "{{ asf_data_dir }}/config"
asf_logs_dir: "{{ asf_data_dir }}/logs"

# Git-managed Compose file
asf_compose_source: >-
  {{ playbook_dir }}/../../docker/asf/compose.yml

# Deployed Compose file
asf_compose_destination: "{{ asf_project_dir }}/compose.yml"

# Management disabled during adoption
asf_manage_compose: false

# Local backup management
backup_manage: true
backup_enable_timer: true

backup_directory: /var/backups/vps
backup_script: /usr/local/sbin/vps-backup
backup_paths_file: /etc/vps-backup/paths

# Retention and disk safeguards
backup_settings_file: /etc/vps-backup/settings.conf
backup_retention_script: /usr/local/sbin/vps-backup-retain

backup_keep_count: 7
backup_min_age_hours: 48
backup_min_free_mb: 512

# Enable only after reviewing the dry run
backup_enable_retention: true

backup_sources:
  - "{{ asf_config_dir }}"
  - "{{ caddy_config_destination }}"
  - "{{ caddy_env_file }}"
  - "{{ caddy_project_dir }}/compose.yml"
  - "{{ asf_compose_destination }}"
  - "{{ vps_web_root }}"

backup_service_name: vps-backup.service
backup_timer_name: vps-backup.timer

# Firewall
firewall_manage_rules: false

firewall_expected_active: true
firewall_default_incoming: deny
firewall_default_outgoing: allow

firewall_ssh_port: 22
firewall_ssh_protocol: tcp

# Expected UFW-managed inbound rules.
# Start with SSH; audit any additional existing rules.
firewall_allowed_rules:
  - port: "{{ firewall_ssh_port }}"
    proto: "{{ firewall_ssh_protocol }}"
    rule: allow

# Static websites
web_manage_directories: true

web_sites:
  - name: manabie
    root: "{{ vps_web_root }}/manabie"
    domain: manabie.vietthe.dev
    type: spa

  - name: nana
    root: "{{ vps_web_root }}/nana"
    domain: nana.vietthe.dev
    type: static

# Populate with observed directory metadata
# before enabling management.
web_directory_metadata:
  - name: manabie
    root: "{{ vps_web_root }}/manabie"
    owner: root
    group: root
    mode: "0755"

  - name: nana
    root: "{{ vps_web_root }}/nana"
    owner: root
    group: root
    mode: "0755"

# Health monitoring
health_services:
  - ssh
  - docker

health_containers:
  - caddy
  - asf

health_endpoints:
  - https://manabie.vietthe.dev/
  - https://nana.vietthe.dev/

health_backup_timer: vps-backup.timer
health_min_free_mb: 512

# OS maintenance
maintenance_manage_apt_cache: false
maintenance_apt_cache_valid_time: 3600

# Minimum available disk space for maintenance
maintenance_min_free_mb: 512

# Controlled package updates
maintenance_apply_updates: false
maintenance_upgrade_approval: ""

# Exact package names approved for this execution.
# An empty list never authorizes an upgrade.
maintenance_approved_packages: []

# Local backup prerequisites
maintenance_backup_directory: "{{ backup_directory }}"
maintenance_backup_max_age_hours: 36

# Minimum free disk space before upgrades
maintenance_upgrade_min_free_mb: 1024

# No automatic reboot
maintenance_allow_reboot: false

# Infrastructure reproducibility audit
repro_expected_containers: "{{ docker_expected_containers }}"

# Essential live paths
repro_required_paths:
  - "{{ caddy_project_dir }}/compose.yml"
  - "{{ caddy_config_destination }}/Caddyfile"
  - "{{ caddy_env_file }}"
  - "{{ asf_compose_destination }}"
  - "{{ asf_config_dir }}"
  - "{{ vps_web_root }}/manabie/index.html"
  - "{{ vps_web_root }}/nana/index.html"
  - "{{ backup_script }}"
  - "{{ backup_paths_file }}"
  - "{{ backup_settings_file }}"

# Critical sources that should be in local backups
repro_required_backup_sources:
  - "{{ asf_config_dir }}"
  - "{{ caddy_env_file }}"
  - "{{ caddy_config_destination }}"
  - "{{ caddy_project_dir }}/compose.yml"
  - "{{ asf_compose_destination }}"
  - "{{ vps_web_root }}"

# Expected version-controlled deployment sources
repro_repository_files:
  - "{{ playbook_dir }}/../../docker/caddy/Dockerfile"
  - "{{ playbook_dir }}/../../docker/caddy/compose.yml"
  - "{{ playbook_dir }}/../../docker/caddy/config/Caddyfile"
  - "{{ playbook_dir }}/../../docker/asf/compose.yml"

