name: caddy-proxy

services:
  caddy:
    build:
      context: .
      dockerfile: Dockerfile
    image: caddy-cloudflare:2
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80/tcp"
      - "443:443/tcp"
      - "443:443/udp"
    volumes:
      - ./config:/etc/caddy:ro
      - /srv/www/manabie:/srv/www/manabie:ro
      - /srv/www/nana:/srv/www/nana:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:?CLOUDFLARE_API_TOKEN is required}
    networks:
      - proxy

volumes:
  caddy_data:
  caddy_config:

networks:
  proxy:
    external: true
